name: order_printer
description: Take restaurant orders and print them on a SUNMI NT311 (or any ESC/POS network printer).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  path_provider: ^2.1.4
  share_plus: ^12.0.2
  # 10.3.10: compiles against Flutter's Android SDK level (8.x failed with
  # "requires compileSdk 36"); same API as 8.x.
  file_picker: 10.3.10
  archive: ^3.6.1
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
